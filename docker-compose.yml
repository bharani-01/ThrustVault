version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: thrustvault_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 5196
      POSTGRES_DB: postgres
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql
      - ./database/02_seed.sql:/docker-entrypoint-initdb.d/02_seed.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: thrustvault_app
    restart: always
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
    environment:
      - NODE_ENV=production
      - DB_HOST=db
      - DB_PORT=5432
      - DB_USER=postgres
      - DB_PASSWORD=5196
      - DB_NAME=postgres
      - DB_SSL=${DB_SSL:-false}
      - SESSION_SECRET=${SESSION_SECRET:-tv-s3cr3t-k3y-change-before-deploy-2025}
      - APP_BASE_URL=${APP_BASE_URL:-http://localhost:8000}
      - RESEND_API_KEY=${RESEND_API_KEY:-your_resend_api_key_here}
      - GROQ_API_KEY=${GROQ_API_KEY:-your_groq_api_key_here}
      - GROQ_MODEL=llama-3.3-70b-versatile
      - auditlog=false

  admin-app:
    build:
      context: ../ThrustVault-Admin
      dockerfile: Dockerfile
    container_name: thrustvault_admin
    restart: always
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8001:8001"
    environment:
      - NODE_ENV=production
      - DB_HOST=db
      - DB_PORT=5432
      - DB_USER=postgres
      - DB_PASSWORD=5196
      - DB_NAME=postgres
      - DB_SSL=${DB_SSL:-false}
      - SESSION_SECRET=${SESSION_SECRET:-tv-s3cr3t-k3y-change-before-deploy-2025}
      - APP_BASE_URL=${APP_BASE_URL:-http://localhost:8000}
      - RESEND_API_KEY=${RESEND_API_KEY:-your_resend_api_key_here}
      - ADMIN_PORT=8001
      - auditlog=false


volumes:
  pgdata:
    driver: local
